name: Build and Release .skill

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build .skill file
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          zip -r "app-review-classifier-${VERSION}.skill" review-classifier-skill/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.skill"
          generate_release_notes: false
          body_path: CHANGELOG.md
